name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: vercel link --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Sync env vars from GitHub secrets (source of truth)
        run: |
          set -e
          sync_env() {
            name="$1"
            value="$2"
            vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" production --no-sensitive --token="$VERCEL_TOKEN"
          }
          sync_env NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL_VALUE"
          sync_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY_VALUE"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL_VALUE: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY_VALUE: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
